name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Preview screenshots for review
        run: |
          npx playwright install --with-deps chromium
          npm run preview
      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: preview/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Publishing waits until the repository is public, so the site can be reviewed first.
    if: ${{ !github.event.repository.private }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
